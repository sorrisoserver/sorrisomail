# Build de teste do Sorriso Server Mail, sem publicação ou instalação.
name: Sorriso Server Mail - Windows Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mailcraft/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sorriso-windows-test.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Build Windows executable
        run: cargo build --release -p mailcraft --bin mailcraft
        env:
          MAILCRAFT_REQUIRE_WINRES: '1'
      - name: Check generated executable
        shell: pwsh
        run: |
          if (-not (Test-Path "target/release/mailcraft.exe")) {
            throw "Windows executable not generated"
          }
          Get-Item "target/release/mailcraft.exe" | Select-Object Name, Length, LastWriteTime
      - name: Upload unsigned test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sorriso-server-mail-windows-x64-unsigned
          path: target/release/mailcraft.exe
          if-no-files-found: error
          retention-days: 14
