name: Sorriso Server Mail - Branded Windows Preview

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sorriso-windows-branded.yml'
      - 'assets/sorriso-server/**'
      - 'scripts/sorriso-brand-assets.py'
      - 'scripts/requirements-brand.txt'
      - 'apps/mailcraft/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require approved Sorriso Server logo
        shell: pwsh
        run: |
          if (-not (Test-Path 'assets/sorriso-server/logo-oficial.jpeg')) {
            throw 'Logo oficial ausente. Adicione assets/sorriso-server/logo-oficial.jpeg antes de gerar a versao personalizada.'
          }
      - name: Require Brazilian Portuguese catalogue
        shell: pwsh
        run: |
          if (-not (Test-Path 'crates/i18n/po/pt-BR.po')) {
            throw 'Catalogo pt-BR ausente. A versao Sorriso Server Mail deve conter portugues brasileiro.'
          }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-brand.txt
      - name: Install image tooling
        run: python -m pip install -r scripts/requirements-brand.txt
      - name: Prepare official brand assets
        run: python scripts/sorriso-brand-assets.py assets/sorriso-server/logo-oficial.jpeg
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release executable with branded Windows resource
        run: cargo build --release --locked -p mailcraft --bin mailcraft
        env:
          MAILCRAFT_REQUIRE_WINRES: '1'
      - name: Verify generated executables and icon
        shell: pwsh
        run: |
          foreach ($path in @('assets/sorriso-server/sorriso-server.ico', 'target/release/mailcraft.exe')) {
            if (-not (Test-Path $path)) { throw "Arquivo esperado ausente: $path" }
          }
          Copy-Item 'target/release/mailcraft.exe' 'target/release/SorrisoServerMail-Alpha.exe'
      - name: Upload internal preview (unsigned, no installer)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SorrisoServerMail-Windows-x64-Alpha-unsigned
          path: target/release/SorrisoServerMail-Alpha.exe
          if-no-files-found: error
          retention-days: 14
